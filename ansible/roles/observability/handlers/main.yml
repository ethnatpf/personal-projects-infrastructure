- name: Restart Grafana
  community.docker.docker_compose_v2:
    project_src: "{{ observability_directory }}"
    services:
      - grafana
    state: restarted
- name: Recreate Loki
  community.docker.docker_compose_v2:
    project_src: "{{ observability_directory }}"
    services:
      - loki
    state: present
    recreate: always
- name: Recreate Alloy
  community.docker.docker_compose_v2:
    project_src: "{{ observability_directory }}"
    services:
      - alloy
    state: present
    recreate: always
- name: Recreate Tempo
  community.docker.docker_compose_v2:
    project_src: "{{ observability_directory }}"
    services:
      - tempo
    state: present
    recreate: always
