- name: Get VPS Tailscale IPv4 address
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_ip
  changed_when: false

- name: Set Grafana Tailscale address
  ansible.builtin.set_fact:
    grafana_tailscale_ip: "{{ tailscale_ip.stdout | trim }}"

- name: Create shared observability Docker network
  community.docker.docker_network:
    name: observability_shared
    state: present

- name: Create observability directory
  ansible.builtin.file:
    path: "{{ observability_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check for Grafana admin password
  ansible.builtin.stat:
    path: "{{ observability_directory }}/grafana-admin-password"
  register: grafana_password_file

- name: Generate Grafana admin password
  ansible.builtin.shell:
    cmd: >
      umask 077 &&
      openssl rand -hex 32 > grafana-admin-password
    chdir: "{{ observability_directory }}"
  when: not grafana_password_file.stat.exists
  no_log: true

- name: Set Grafana password file permissions
  ansible.builtin.file:
    path: "{{ observability_directory }}/grafana-admin-password"
    owner: root
    group: "472"
    mode: "0640"

- name: Copy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ observability_directory }}/prometheus.yml"
    mode: "0644"

- name: Create Node Exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ observability_directory }}/grafana-provisioning/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - datasources
    - dashboards
    - plugins
    - alerting

- name: Copy Grafana data source configuration
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ observability_directory }}/grafana-provisioning/datasources/datasources.yml"
    mode: "0644"
  notify: Restart Grafana

- name: Copy grafana dashboard configuration
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ observability_directory }}/grafana-provisioning/dashboards/dashboards.yml"
    mode: "0644"

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: ../files/dashboards
    dest: "{{ observability_directory }}/grafana-provisioning"
    mode: "0644"

- name: Deploy Grafana alerting secret
  ansible.builtin.template:
    src: grafana-alerting.env.j2
    dest: "{{ observability_directory }}/grafana-alerting.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy Grafana alerting configuration
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ observability_directory }}/grafana-provisioning/alerting/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ../files/alerting/contact-points.yml
    - disk-usage-alert.yml.j2
    - mongodb-alerts.yml.j2
    - ../files/alerting/notification-policies.yml
  notify: Restart Grafana

- name: Create Loki, Alloy and Tempo configuration directories
  ansible.builtin.file:
    path: "{{ observability_directory }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - loki
    - alloy
    - tempo

- name: Copy Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ observability_directory }}/loki/loki.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate Loki

- name: Copy Alloy configuration
  ansible.builtin.template:
    src: alloy.config.j2
    dest: "{{ observability_directory }}/alloy/config.alloy"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate Alloy

- name: Copy Tempo configuration
  ansible.builtin.template:
    src: tempo.yml.j2
    dest: "{{ observability_directory }}/tempo/tempo.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate Tempo

- name: Copy observability Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ observability_directory }}/compose.yml"
    mode: "0644"

- name: Start observability stack
  community.docker.docker_compose_v2:
    project_src: "{{ observability_directory }}"
    state: present
    wait: true
